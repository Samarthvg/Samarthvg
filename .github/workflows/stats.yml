name: Refresh GitHub stats

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stats
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # stats.py is standard library only.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Draw activity card
        env:
          # STATS_TOKEN, if set, also counts private repositories' languages.
          GH_TOKEN: ${{ secrets.STATS_TOKEN || github.token }}
        run: python tools/stats.py

      - name: Commit if changed
        run: |
          git add assets/activity-*.svg
          if git diff --cached --quiet; then
            echo "No change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh GitHub stats"
          git push
